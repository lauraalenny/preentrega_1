<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPastel - Contacto</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <h1>TechPastel</h1>
        <nav class="nav-bar">
            <ul class="nav-list">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="resenas.html">Reseñas</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h2>Escribinos</h2>
            <p>Dejanos tus dudas y te responderemos a la brevedad.</p>
            <!-- REEMPLAZÁ "tu_id_formspree" por tu código cuando lo tengas -->
            <form action="https://formspree.io/f/xrpbardd" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="message" rows="5" required></textarea>
                </div>
                
                <button type="submit" class="btn-submit">Enviar Consulta</button>
            </form>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 TechPastel. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
